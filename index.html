<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="BrewSmart — AI inventory forecasting and ordering for independent coffee shops.">
  <meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17110A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>BrewSmart — Inventory Forecasting</title>
  <link rel="icon" href="public/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="public/icon.svg">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('brewsmart:v1') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <noscript><p style="padding:24px">BrewSmart needs JavaScript enabled.</p></noscript>
  </div>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
